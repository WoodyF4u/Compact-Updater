PLG_SYSTEM_COMPACTUPDATER="System - Compact Updater"
PLG_SYSTEM_COMPACTUPDATER_XML_DESCRIPTION="Compact Updater: connector for the Updates extension of the Website Monitor. Lets the monitor see which updates Joomla has found (for extensions and for Joomla itself) and install them on request. No user account is needed: every request is signed with a secret key of the monitor. Do not disable this plugin while the site is updated through the monitor."
PLG_SYSTEM_COMPACTUPDATER_FIELD_TOESTAAN_LABEL="Allow updates through the monitor"
PLG_SYSTEM_COMPACTUPDATER_FIELD_TOESTAAN_DESC="When set to No, the monitor can still see which updates are available, but can no longer install anything."
