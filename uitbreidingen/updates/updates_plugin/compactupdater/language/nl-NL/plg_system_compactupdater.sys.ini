PLG_SYSTEM_COMPACTUPDATER="Systeem - Compact Updater"
PLG_SYSTEM_COMPACTUPDATER_XML_DESCRIPTION="Compact Updater: koppeling met de uitbreiding Updates van de Websitesmonitor. Hiermee kan de monitor zien welke updates Joomla heeft gevonden (voor extensies en voor Joomla zelf) en die op verzoek installeren. Er is geen gebruikersaccount voor nodig: elk verzoek is ondertekend met een geheime sleutel van de monitor. Zet deze plugin niet uit zolang de site via de monitor wordt bijgewerkt."
PLG_SYSTEM_COMPACTUPDATER_FIELD_TOESTAAN_LABEL="Updates via de monitor toestaan"
PLG_SYSTEM_COMPACTUPDATER_FIELD_TOESTAAN_DESC="Staat dit op Nee, dan kan de monitor nog wel zien welke updates er zijn, maar niets meer installeren."
